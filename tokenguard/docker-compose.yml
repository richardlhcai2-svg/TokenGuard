services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tokenguard
      POSTGRES_PASSWORD: tokenguard_dev
      POSTGRES_DB: tokenguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokenguard"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://tokenguard:tokenguard_dev@postgres:5432/tokenguard
      DATABASE_URL_ASYNC: postgresql+asyncpg://tokenguard:tokenguard_dev@postgres:5432/tokenguard
      PROXY_SECRET: ${PROXY_SECRET:-dev-secret-key}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      PROXY_SECRET: ${PROXY_SECRET:-dev-secret-key}
      BACKEND_URL: http://backend:8000
      ANTHROPIC_API_URL: https://api.anthropic.com
    depends_on:
      - backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
